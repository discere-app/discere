name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test_and_analyze:
    name: Analyze & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit Tests
        run: flutter test

  integration_test_android:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    needs: test_and_analyze

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghcrunner
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disk-size: 8G
          ram-size: 2048M
          heap-size: 512M
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -no-snapshot -no-boot-anim -noaudio
          emulator-boot-timeout: 600
          script: flutter test integration_test
          force-avd-creation: true

  integration_test_ios:
    name: iOS Integration Tests
    runs-on: macos-latest
    needs: test_and_analyze

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Boot Simulator & Run Integration Tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
            if 'iOS' in runtime:
              for d in devs:
                if 'iPhone' in d['name']:
                  print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$DEVICE_ID" || true
          flutter test integration_test -d "$DEVICE_ID"

  build:
    name: Build Android & iOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration_test_android, integration_test_ios]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign