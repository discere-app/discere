name: Release

# Triggers on version tag push (e.g. 1.0.6 - plain semver, no "v" prefix,
# matching pubspec.yaml's version, see scripts/release/bump_version.sh).
#
# The build number isn't part of the tag or pubspec.yaml: it's computed here
# as the commit count on the tagged commit (git rev-list --count) and passed
# to `flutter build` directly, so every commit on main gets a distinct,
# monotonically increasing build number without anything needing to be
# bumped or committed for it.
on:
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to use current branch/ref)'
        required: false
        type: string
      track:
        description: 'Play Store Track'
        required: true
        default: 'alpha'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Configure signing
        working-directory: android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Signed with the release keystore if android/app/key.properties is
      # present, falling back to debug signing otherwise (see
      # android/app/build.gradle.kts) - no signing secrets are wired up yet.
      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.tag.outputs.value }}" \
            --build-number="${{ steps.build_number.outputs.value }}"

      - name: Build Release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.tag.outputs.value }}" \
            --build-number="${{ steps.build_number.outputs.value }}"

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "discere-${{ steps.tag.outputs.value }}+${{ steps.build_number.outputs.value }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: discere-${{ steps.tag.outputs.value }}+${{ steps.build_number.outputs.value }}.apk
          retention-days: 1

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

  check-release:
    name: Check for existing release
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            if gh release view "${{ steps.tag.outputs.value }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi

  create-release:
    name: Create GitHub Release
    needs: [build, check-release]
    if: needs.ncheck-release.outputs.exists == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Generate release notes
        run: ./scripts/release/generate_changelog.sh --notes-only > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body_path: release-notes.md
          files: discere-${{ steps.tag.outputs.value }}+${{ steps.build_number.outputs.value }}.apk

  upload-google-play:
    name: Upload App Bundle to Google Play
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: aab

      - name: Validate what's new notes
        run: |
          for f in distribution/whatsnew/*/whatsnew; do
            len=$(wc -m < "$f" | tr -d ' ')
            if [ "$len" -eq 0 ]; then
              echo "::error file=$f::whatsnew file is empty"
              exit 1
            fi
            if [ "$len" -gt 500 ]; then
              echo "::error file=$f::whatsnew is $len characters, Play Store limit is 500"
              exit 1
            fi
          done

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ch.feberle.discere
          releaseFiles: app-release.aab
          whatsNewDirectory: distribution/whatsnew
          tracks: ${{ inputs.track || 'alpha' }}
          status: completed
        env:
          ACTIONS_STEP_DEBUG: true