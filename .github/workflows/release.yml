name: Release

# Triggers on version tag push (e.g. 1.0.6 - plain semver, no "v" prefix,
# matching pubspec.yaml's version, see scripts/release/bump_version.sh).
#
# The build number isn't part of the tag or pubspec.yaml: it's computed here
# as the commit count on the tagged commit (git rev-list --count) and passed
# to `flutter build` directly, so every commit on main gets a distinct,
# monotonically increasing build number without anything needing to be
# bumped or committed for it.
on:
  push:
    tags:
      - '*.*.*'


permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Configure signing
        working-directory: android/app
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Signed with the release keystore if android/app/key.properties is
      # present, falling back to debug signing otherwise (see
      # android/app/build.gradle.kts) - no signing secrets are wired up yet.
      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ steps.build_number.outputs.value }}"

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "discere-${{ github.ref_name }}+${{ steps.build_number.outputs.value }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: discere-${{ github.ref_name }}+${{ steps.build_number.outputs.value }}.apk
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Generate release notes
        run: ./scripts/release/generate_changelog.sh --notes-only > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: discere-${{ github.ref_name }}+${{ steps.build_number.outputs.value }}.apk
