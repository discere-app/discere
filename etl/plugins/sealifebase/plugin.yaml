name: sealifebase
version: 1
source: sealifebase
placement_priority: 20  # Rang der Einordnung, kleiner = gewichtiger (docs/datenquellen.md)

provides:
  - classes
  - orders
  - families
  - genera
  - species
  - pictures

requires:
  - duckdb
  - sqlite3
  - curl  # nur zum Herunterladen

# Eigene Flags; die gemeinsamen stehen in docs/plugin-interface.md.
flags:
  - --version <v26.06>       # SeaLifeBase-Version (Default: v26.06)
  - --slb-dir <path>         # Lokaler Parquet-Pfad, ohne Download und Löschen

env:
  SLB_VERSION:     Entspricht --version
  SLB_DIR:         Entspricht --slb-dir
