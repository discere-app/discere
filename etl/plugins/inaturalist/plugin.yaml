name: inaturalist
version: 1
source: inaturalist

# Ordnet vorhandenen Entitäten ihre iNaturalist-Taxon-ID zu. Die Quelle legt
# keine Entitäten an und liefert keine Einordnung (keine placement_priority).
provides:
  - entity_external_ids

requires:
  - duckdb
  - sqlite3
  - curl  # nur zum Herunterladen

depends_on_sources:
  - fishbase
  - sealifebase

optional: true  # ergänzt nur; --no-enrich überspringt die Quelle

# Eigene Flags; die gemeinsamen stehen in docs/plugin-interface.md.
flags:
  - --taxa-file <path>  # vorhandene taxa.csv.gz, ohne Download und Löschen

env:
  INAT_TAXA_FILE: Entspricht --taxa-file
