name: fishbase
version: 1
source: fishbase
placement_priority: 10  # Rang der Einordnung, kleiner = gewichtiger (docs/datenquellen.md)

provides:
  - classes
  - orders
  - families
  - genera
  - species
  - pictures

requires:
  - duckdb
  - sqlite3
  - curl  # nur zum Herunterladen

# Eigene Flags; die gemeinsamen stehen in docs/plugin-interface.md.
flags:
  - --version <v26.06>    # FishBase-Version (Default: v26.06)
  - --fishbase-dir <path> # Lokaler Parquet-Pfad, ohne Download und Löschen

env:
  FISHBASE_VERSION: Entspricht --version
  FISHBASE_DIR:     Entspricht --fishbase-dir
