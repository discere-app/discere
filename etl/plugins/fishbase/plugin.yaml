name: fishbase
version: 1
source: fishbase

provides:
  - classes
  - orders
  - families
  - genera
  - species
  - pictures

requires:
  - duckdb
  - sqlite3
  - curl  # nur bei --download

flags:
  - --db <path>           # Pflichtfeld
  - --download            # Parquets von Source Cooperative laden
  - --no-download         # Lokale Dateien verwenden
  - --keep                # Parquets nach Import behalten
  - --version <v26.07>    # FishBase-Version (Default: v26.07)
  - --fishbase-dir <path> # Lokaler Parquet-Pfad

env:
  DB_PATH:          Entspricht --db
  FISHBASE_VERSION: Entspricht --version
  FISHBASE_DIR:     Entspricht --fishbase-dir
