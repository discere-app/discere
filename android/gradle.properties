org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# CI pins JDK 17 via actions/setup-java (see .github/workflows/flutter_ci.yml).
# Gradle needs a JDK it supports to even start — newer JDKs auto-detected on
# some machines (e.g. the JBR bundled with Android Studio) can be too new and
# fail with a bare version-number IllegalArgumentException. Set JAVA_HOME in
# your shell profile to a JDK 17 install, or uncomment and adjust below:
# org.gradle.java.home=/path/to/jdk-17
android.enableJetifier=true
android.newDsl=false

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
