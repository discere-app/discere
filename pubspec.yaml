name: discere
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+20

environment:
  sdk: '>=3.8.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # --- State Management & Architecture ---
  provider: ^6.1.2 # Core state management for the app

  # --- Local Storage & Databases ---
  sqflite: ^2.3.3 # Main SQLite database engine
  shared_preferences: ^2.2.3 # Key-value storage for simple app settings
  path: ^1.9.0 # File and directory path manipulation
  path_provider: ^2.1.6 # Access to iOS/Android device directories

  # --- Device Capabilities & Features ---
  permission_handler: ^12.0.1 # Requesting system permissions (camera, notifications)
  image_picker: ^1.2.3 # Selecting images from gallery or camera
  gal: ^2.3.2 # Saving images directly to the user's gallery
  share_plus: ^13.2.0 # Sharing text, links, and content to other apps
  file_picker: ^12.0.0-beta.7 # File selection for JSON import

  # --- User Interface & Visuals ---
  cupertino_icons: ^1.0.6 # iOS style icons
  carousel_slider: ^5.0.0 # Image carousel for walkthoughs/overviews
  swipe_to: ^1.0.6 # Swipeable elements (e.g. for flashcards/lists)
  cached_network_image: ^3.4.1 # Loading and locally caching internet images
  flutter_native_splash: ^2.4.7 # Custom splash screens during app boot

  # --- background & System Services ---
  flutter_local_notifications: ^22.0.1 # Scheduling local push notifications
  timezone: any # Timezone database for precise notification scheduling

  # --- QR Code Integrations ---
  mobile_scanner: ^7.2.0 # Scanning QR codes via camera
  qr_flutter: ^4.1.0 # Rendering generated QR codes on screen

  # --- Networking & External APIs ---
  http: ^1.2.1 # Making HTTP requests (e.g. searching images online)
  url_launcher: ^6.3.1 # Opening external web browser links
  workmanager: ^0.9.0+3 # Background task scheduling for Android/iOS

  # --- Core Utilities ---
  uuid: ^4.4.2 # Generating unique identifiers for DB records
  intl: any # Date formatting and internationalization
  rxdart: ^0.28.0 # Reactive programming streams and subjects
  json_annotation: ^4.9.0 # Annotations for JSON serialization

  # --- Localization ---
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  flutter_foreground_task: ^9.2.2
  connectivity_plus: ^7.2.0
  tutorial_coach_mark: ^1.3.3
  package_info_plus: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # --- Testing & Mocking ---
  sqflite_common_ffi: # SQLite support for desktop/unit tests
  mockito: ^5.6.3 # Generating mock classes for tests

  # --- Code Generation ---
  build_runner: ^2.13.1 # Tool for executing code generators
  json_serializable: ^6.13.1 # Auto-generates fromJson/toJson boilerplate

  # --- Lints & Formatting ---
  flutter_lints: ^6.0.0 # Standard Flutter code style rules

  # --- Build / Deployment Tooling ---
  flutter_launcher_icons: ^0.14.3 # Generates Android/iOS app icons
  share_plus_platform_interface: ^7.1.0 # SharePlus transitive interface requirement
  dart_arch_test: ^0.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    # The full reference DB is downloaded at runtime (see
    # ReferenceDatabaseProvisioner) rather than bundled — it outgrew the app
    # bundle. Only the small test fixture ships, needed by integration tests
    # that run inside the compiled app on-device (see
    # integration_test/test_utils.dart). Flutter has no test-only asset
    # scoping, so this ~1.4MB file does end up in real release builds too —
    # deliberate, accepted tradeoff (see CLAUDE.md's Testing section).
    - test/fixtures/discere_reference_test.db
    - assets/icon/icon.png
    - assets/icon/icon_light.png
    - assets/icon/signature.png
    - assets/icon/signature_light.png
    - assets/icon/splash.png
    - assets/icon/splash_light.png
    - assets/sql/user_db/tables/create_decks.sql
    - assets/sql/user_db/tables/create_flashcard_stats.sql
    - assets/sql/user_db/tables/create_inat_photo_cache.sql
    - assets/sql/user_db/tables/create_runtime_common_names.sql
    - assets/sql/user_db/tables/create_runtime_common_name_search_documents.sql
    - assets/sql/user_db/tables/create_external_identifier_cache.sql
    - assets/sql/user_db/tables/create_enrichment_jobs.sql
    - assets/sql/user_db/tables/create_enrichment_job_stages.sql
    - assets/sql/user_db/tables/create_enrichment_species_work.sql
    - assets/sql/user_db/tables/create_enrichment_taxonomy_work.sql
    - assets/sql/user_db/tables/create_local_diagnostics_events.sql
    - assets/sql/user_db/tables/create_local_diagnostics_network_failures.sql
    - assets/sql/user_db/tables/create_deck_config.sql
    - assets/sql/user_db/tables/create_daily_counts.sql
    - assets/sql/user_db/fts/create_runtime_common_name_search_fts.sql

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
          weight: 700

  generate: true
